<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Portal Executivo Financeiro</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f1f5f9;background:#07111e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 12%,#163b51 0,transparent 36%),radial-gradient(circle at 85% 80%,#122a40 0,transparent 38%),#07111e}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);background:rgba(12,27,44,.94);border:1px solid #2a4155;border-radius:22px;padding:38px;box-shadow:0 30px 90px #0008}.brand{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.mark{width:40px;height:40px;border-radius:12px;background:#153f50;display:grid;place-items:center;color:#4fd1bc;font-size:22px}.line{height:1px;background:#294053;margin:28px 0}h1{font-size:clamp(26px,5vw,32px);line-height:1.2;margin:0 0 12px;letter-spacing:-.7px}p{color:#9cb0c1;line-height:1.6;margin:0 0 28px;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}.field{position:relative}input{width:100%;padding:15px 53px 15px 15px;background:#091725;border:1px solid #3a5368;border-radius:11px;color:white;font:inherit;outline:none}input:focus{border-color:#4fd1bc;box-shadow:0 0 0 3px #4fd1bc22}.show{position:absolute;right:9px;top:8px;border:0;background:transparent;color:#a8c0d0;padding:9px;cursor:pointer}button.primary{width:100%;margin-top:20px;border:0;border-radius:11px;padding:15px;background:#4fd1bc;color:#062a2c;font-weight:750;font-size:15px;cursor:pointer}button.primary:hover{background:#7be3d2}button.primary:disabled{opacity:.6;cursor:wait}.error{color:#fda4af;font-size:13px;margin-top:12px;min-height:20px}.foot{color:#7890a2;text-align:center;font-size:11px;margin-top:26px}.dashboard{display:none;min-height:100vh;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#0c1b2c;border-bottom:1px solid #2 </style></head><body><main class="shell" id="login"><section class="panel"><div class="brand"><span class="mark">▥</span> Inteligência &amp; Gestão</div><div class="line"></div><h1>Portal Executivo<br>Financeiro</h1><p>Uma visão estratégica dos seus indicadores. Informe sua senha para acessar o painel executivo.</p><form id="form"><label for="password">Senha de acesso</label><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required autofocus><button class="show" type="button" id="toggle" aria-label="Mostrar senha">Mostrar</button></div><button class="primary" id="submit" type="submit">Acessar dashboard →</button><div class="error" id="error" role="alert" aria-live="polite"></div></form><div class="foot">Acesso reservado • Portal Executivo Financeiro</div></section></main><section class="dashboard" id="dashboard"><header class="topbar"><strong>▥ &nbsp; Portal Executivo Financeiro</strong><button id="logout">Encerrar acesso</button></header><iframe id="report" title="Dashboard financeiro do Power BI" allowfullscreen referrerpolicy="no-referrer"></iframe></section><script>
const salt="tKJTsH3+dlwgbmRsVQ3sOw==",iv="TUeeazBcOKK3mm32",ciphertext="BCu6jm96uN/253fXHjSeeztkBHAWHMKPVjyiBQBoMeyd7X4PiZ6V0v7ZkLDDvBzGGnKievZgyHMqcnaXmK0lU0LuigVaPn4namoZmZam6IyN8PC9JkrOORh3tNLMKOxsiu8TRdfFn4ZvEb4ZszP/w5EkE2Vzf0NthqzbC1QXE4mWHuN39eK52g56KZj2AwSYdigulftwrWzWumXpEb5VZWWiyg==",iterations=250000;
const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const form=document.getElementById('form'),password=document.getElementById('password'),error=document.getElementById('error'),submit=document.getElementById('submit'),report=document.getElementById('report');
document.getElementById('toggle').addEventListener('click',()=>{password.type=password.type==='password'?'text':'password';document.getElementById('toggle').textContent=password.type==='password'?'Mostrar':'Ocultar'});
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='Validando acesso…';try{if(!crypto.subtle)throw Error('Abra esta página em HTTPS.');const raw=new TextEncoder().encode(password.value);const material=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(salt),iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(iv)},key,bytes(ciphertext));const url=new TextDecoder().decode(plain);if(!url.startsWith('https://app.powerbi.com/view?'))throw Error('Endereço inválido');report.src=url;password.value='';document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='flex'}catch(ex){error.textContent=ex.message==='Abra esta página em HTTPS.'?ex.message:'Senha incorreta. Verifique e tente novamente.'}finally{submit.disabled=false;submit.textContent='Acessar dashboard →'}});
document.getElementById('logout').addEventListener('click',()=>{report.src='about:blank';document.getElementById('dashboard').style.display='none';document.getElementById('login').style.display='grid';password.focus()});
</script></body></html>
